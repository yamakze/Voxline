name: Update Homebrew Cask

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: homebrew-cask
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Download latest stable release and generate Cask
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Expected a stable version tag' >&2
            exit 1
          fi
          archive="Voxline-${tag#v}.zip"
          gh release download "$tag" --pattern "$archive" --pattern SHA256SUMS.txt --dir "$RUNNER_TEMP/release"
          python3 - "$RUNNER_TEMP/release" "$archive" <<'PY'
          import hashlib, sys
          from pathlib import Path
          directory, name = Path(sys.argv[1]), sys.argv[2]
          expected = dict(line.split('  ', 1)[::-1] for line in (directory / 'SHA256SUMS.txt').read_text().splitlines())
          with (directory / name).open('rb') as file:
              actual = hashlib.file_digest(file, 'sha256').hexdigest()
          if expected[name] != actual:
              raise SystemExit('Published archive does not match SHA256SUMS.txt')
          PY
          python3 Scripts/update-homebrew-cask.py "$tag" "$RUNNER_TEMP/release/$archive"
      - name: Commit Cask on default branch
        run: |
          if [[ -z "$(git status --porcelain -- Casks/voxline.rb)" ]]; then
            echo 'Cask is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Casks/voxline.rb
          git commit -m 'chore: update Homebrew Cask from published release'
          git push
