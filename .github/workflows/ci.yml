name: Core checks and iOS build

on:
  push:
    branches: [master, main]
    paths-ignore: ['docs/**', 'README*']
  pull_request:
    paths-ignore: ['docs/**', 'README*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Test core workflows
        run: make test
      - name: Package macOS application
        env:
          VOXLINE_MAC_SIGN_IDENTITY: '-'
        run: Scripts/build-app.sh debug
      - name: Build unsigned iOS application
        run: Scripts/build-ios.sh device debug
      - name: Check localization
        run: python3 Scripts/check-localization.py .build/ios/device/DerivedData/Build/Intermediates.noindex/Voxline.build/Debug-iphoneos
